#### REQUIRED ####
vcf: "path/to/vcf"   # path to the VCF variant file (must be compressed and indexed)
model: "{RALPHI_ROOT}/data/models/ralphi.v2.long.pt"  # path to the pretrained ralphi model for ONT reads
reference: "/path/to/fai"  # path to the reference FASTA file, required if realigm is True (if any of the input platforms is ont or hifi)
inputs:
  - platform: "illumina" # sequencing platform (options: ont, hifi, hic  or illumina)
    bam: "/path/to/bam"  # path to the BAM alignments file
  - platform: "ont"  # sequencing platform (options: ont, hifi, hic or illumina)
    bam: "/path/to/bam"  # path to the BAM alignments file
    realign: True  # if realignment has to be performed
#### OPTIONAL ####
chr_names: null  # list of chromosomes to process: null (all) or a specific list e.g. ["chr1", "chr21"]
n_procs: 22  # number of cores (used to process chromosomes in parallel)
num_cores_torch: 8  # number PyTorch threads (used for intraop parallelism)
